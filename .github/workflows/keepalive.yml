# Pings the Supabase project every 3 days so the free plan does not pause it for inactivity.
name: keep-supabase-awake
on:
  schedule:
    - cron: '17 6 */3 * *'
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping database
        run: |
          curl -fsS -m 30 "https://emlecimzeyvjyetsqmwp.supabase.co/rest/v1/quotes?select=id&limit=1" \
            -H "apikey: sb_publishable_PkeiGzG3mRdDS1uAoTdq2Q_fypM6ZIO" -o /dev/null -w "HTTP %{http_code}\n"
